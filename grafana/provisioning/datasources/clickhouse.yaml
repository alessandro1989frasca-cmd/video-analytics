# Grafana datasource provisioning — auto-configures ClickHouse on startup
apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      username: default
      defaultDatabase: analytics
      protocol: native
    secureJsonData:
      password: ""
    version: 1
    editable: true
