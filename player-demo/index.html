<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAI Live — Analytics Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0f0f0f; color:#e0e0e0; font-family:'Segoe UI',sans-serif; min-height:100vh; }

    header {
      background:#1a1a2e; padding:10px 20px;
      display:flex; align-items:center; gap:10px;
      border-bottom:2px solid #c8102e;
    }
    header .logo { font-size:20px; font-weight:700; color:#fff; }
    header .badge {
      background:#c8102e; color:#fff; font-size:11px;
      padding:2px 8px; border-radius:4px; font-weight:600;
    }

    /* ── Selettore canale ── */
    .channel-bar {
      background:#161622; padding:8px 20px;
      display:flex; align-items:center; gap:10px;
      border-bottom:1px solid #222;
    }
    .channel-bar label { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:.5px; }
    .ch-btn {
      padding:5px 16px; border-radius:5px; border:1px solid #333;
      background:#1e1e30; color:#aaa; font-size:12px; font-weight:600;
      cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:7px;
    }
    .ch-btn:hover { border-color:#c8102e; color:#fff; }
    .ch-btn.active { background:#c8102e; color:#fff; border-color:#c8102e; }
    .ch-btn .ch-dot { width:7px; height:7px; background:currentColor; border-radius:50%; opacity:.7; animation:blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:.7} 50%{opacity:.15} }

    /* ── Viewer ID badge ── */
    .viewer-badge {
      margin-left:auto; font-size:10px; color:#444;
      display:flex; align-items:center; gap:6px;
    }
    .viewer-badge .vid {
      background:#1e1e30; border:1px solid #333; color:#5c6bc0;
      padding:3px 10px; border-radius:4px; font-family:monospace; font-size:11px;
      letter-spacing:.5px;
    }
    .viewer-badge button {
      background:none; border:1px solid #333; color:#555; font-size:10px;
      padding:2px 7px; border-radius:4px; cursor:pointer;
    }
    .viewer-badge button:hover { border-color:#666; color:#aaa; }

    .layout { display:flex; height:calc(100vh - 95px); }

    .player-col { flex:1; display:flex; flex-direction:column; background:#000; }

    .video-wrapper { position:relative; width:100%; aspect-ratio:16/9; background:#000; max-height:65vh; }
    video { width:100%; height:100%; display:block; }

    .live-badge {
      position:absolute; top:10px; left:10px;
      background:#c8102e; color:#fff; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:4px; letter-spacing:1px;
      display:flex; align-items:center; gap:5px;
    }
    .channel-name-overlay {
      position:absolute; top:10px; right:10px;
      background:rgba(0,0,0,.6); color:#fff; font-size:13px; font-weight:700;
      padding:3px 12px; border-radius:4px;
    }

    .metrics-bar { display:flex; background:#111; border-top:1px solid #222; flex-wrap:wrap; }
    .metric { flex:1; min-width:100px; padding:8px 14px; border-right:1px solid #222; text-align:center; }
    .metric:last-child { border-right:none; }
    .metric .label { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
    .metric .value { font-size:17px; font-weight:700; color:#4fc3f7; font-variant-numeric:tabular-nums; }
    .metric .value.bad  { color:#ef5350; }
    .metric .value.warn { color:#ffa726; }
    .metric .value.good { color:#66bb6a; }

    /* ── Barra controlli custom ── */
    .controls-bar {
      background:#0a0a0a; padding:8px 16px;
      display:flex; align-items:center; gap:10px;
      border-top:1px solid #1a1a1a;
    }
    .ctrl-btn {
      background:none; border:none; color:#aaa; font-size:18px;
      cursor:pointer; padding:2px 6px; border-radius:4px;
      transition:color .15s;
    }
    .ctrl-btn:hover { color:#fff; }

    .live-indicator {
      display:inline-flex; align-items:center; gap:5px;
      background:#1a1a1a; border:1px solid #333;
      color:#aaa; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:4px; cursor:pointer;
      letter-spacing:1px; transition:all .15s;
    }
    .live-indicator:hover { border-color:#c8102e; color:#fff; }
    .live-indicator.at-live { background:#c8102e22; border-color:#c8102e; color:#c8102e; }
    .live-dot {
      width:7px; height:7px; background:#c8102e;
      border-radius:50%; animation:blink 1.2s infinite;
      display:inline-block;
    }
    .dvr-control {
      display:flex; align-items:center; gap:7px; min-width:180px; flex:1;
      color:#777; font-size:10px;
    }
    .dvr-control[hidden] { display:none; }
    #dvr-seek {
      flex:1; min-width:100px; accent-color:#c8102e; cursor:pointer;
    }
    #dvr-time { min-width:42px; color:#aaa; font-variant-numeric:tabular-nums; }

    .quality-bar {
      background:#0d0d0d; padding:8px 14px;
      border-top:1px solid #1a1a1a;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .quality-bar label { font-size:11px; color:#555; text-transform:uppercase; letter-spacing:.5px; }
    #quality-buttons { display:flex; gap:5px; flex-wrap:wrap; }
    .q-btn {
      background:#222; color:#aaa; border:1px solid #333;
      padding:3px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:600;
    }
    .q-btn.active-q { background:#c8102e; color:#fff; border-color:#c8102e; }

    /* log */
    .log-col { width:370px; background:#111; border-left:1px solid #222; display:flex; flex-direction:column; }
    .log-header {
      padding:10px 14px; background:#1a1a1a; border-bottom:1px solid #222;
      font-size:11px; font-weight:600; color:#888; text-transform:uppercase;
      letter-spacing:.5px; display:flex; justify-content:space-between; align-items:center;
    }
    .log-header .count { background:#282828; color:#aaa; font-size:11px; padding:2px 7px; border-radius:10px; }
    #event-log { flex:1; overflow-y:auto; padding:6px 0; }
    .event-row {
      display:flex; align-items:flex-start; gap:8px;
      padding:5px 12px; border-bottom:1px solid #181818;
      animation:fadein .25s ease;
    }
    @keyframes fadein { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
    .event-time { font-size:10px; color:#444; white-space:nowrap; margin-top:2px; font-variant-numeric:tabular-nums; }
    .event-type { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; white-space:nowrap; }
    .event-detail { font-size:11px; color:#666; line-height:1.4; word-break:break-all; }

    .et-SESSION_START   { background:#1a3a5c; color:#64b5f6; }
    .et-SESSION_END     { background:#2a1a1a; color:#ff8a65; }
    .et-PLAY_REQUEST    { background:#1a3a5c; color:#90caf9; }
    .et-FIRST_FRAME     { background:#1b4332; color:#66bb6a; }
    .et-HEARTBEAT       { background:#1a1a2e; color:#5c6bc0; }
    .et-BUFFERING_START { background:#3e2000; color:#ffa726; }
    .et-BUFFERING_END   { background:#1b4332; color:#81c784; }
    .et-BITRATE_CHANGE  { background:#2a1a4a; color:#ce93d8; }
    .et-CDN_REQUEST     { background:#1a2a1a; color:#4db6ac; }
    .et-ERROR           { background:#3e1a1a; color:#ef5350; }
    .et-JOIN_TIME       { background:#1b4332; color:#a5d6a7; }
    .et-SEEK            { background:#3d2d12; color:#ffcc80; }
    .et-SESSION_DIVIDER { background:#111; border-top:1px solid #333 !important; }

    .status-bar {
      padding:6px 14px; background:#0d0d0d; border-top:1px solid #1a1a1a;
      font-size:10px; color:#444; display:flex; gap:12px; flex-wrap:wrap;
    }
    .status-bar .ok  { color:#66bb6a; }
    .status-bar .err { color:#ef5350; }

    #event-log::-webkit-scrollbar { width:5px; }
    #event-log::-webkit-scrollbar-track { background:#111; }
    #event-log::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:3px; }
  </style>
</head>
<body>

<header>
  <div class="logo" id="header-logo">RAI News</div>
  <div class="badge">LIVE</div>
  <div style="flex:1"></div>
  <div style="font-size:11px;color:#444;">Video QoE Analytics Demo</div>
</header>

<!-- ── Selettore canale + Viewer ID ── -->
<div class="channel-bar">
  <label>Canale:</label>

  <button class="ch-btn active" data-channel="rainews" onclick="switchChannel('rainews', this)">
    <span class="ch-dot"></span> RAI News
  </button>
  <button class="ch-btn" data-channel="rai2" onclick="switchChannel('rai2', this)">
    <span class="ch-dot"></span> RAI 2
  </button>
  <button class="ch-btn" data-channel="rai1" onclick="switchChannel('rai1', this)">
    <span class="ch-dot"></span> RAI 1
  </button>

  <!-- Viewer ID — persistente su localStorage -->
  <div class="viewer-badge">
    <span>Viewer ID:</span>
    <span class="vid" id="viewer-id-display">—</span>
    <button onclick="resetViewerId()" title="Genera nuovo Viewer ID (simula nuovo utente)">↺ reset</button>
  </div>
</div>

<div class="layout">
  <div class="player-col">
    <div class="video-wrapper">
      <!-- controls rimosso — usiamo la barra custom sotto -->
      <video id="video" autoplay muted playsinline></video>
      <div class="live-badge"><span style="width:7px;height:7px;background:#fff;border-radius:50%;animation:blink 1.2s infinite;display:inline-block"></span>&nbsp;LIVE</div>
      <div class="channel-name-overlay" id="channel-overlay">RAI News</div>
      <!-- click sul video = play/pause -->
      <div id="video-overlay" style="position:absolute;inset:0;cursor:pointer;" onclick="togglePlayPause()"></div>
    </div>

    <!-- Barra controlli custom con supporto DVR quando presente nella playlist -->
    <div class="controls-bar">
      <button class="ctrl-btn" id="btn-playpause" onclick="togglePlayPause()" title="Play/Pause">⏸</button>

      <!-- Volume -->
      <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()" title="Mute/Unmute">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1"
             oninput="setVolume(this.value)" style="width:80px;cursor:pointer;accent-color:#c8102e;">

      <div class="dvr-control" id="dvr-control" hidden>
        <span>DVR</span>
        <input type="range" id="dvr-seek" min="0" max="0" step="0.1" value="0"
               oninput="previewDvrPosition(this.value)" onchange="seekToDvr(this.value)"
               aria-label="Posizione DVR">
        <span id="dvr-time">LIVE</span>
      </div>

      <!-- Indicatore LIVE — click riporta al live edge -->
      <div style="flex:1;display:flex;align-items:center;gap:8px;justify-content:center;">
        <div class="live-indicator" id="live-indicator" onclick="seekToLive()" title="Clicca per tornare al live edge">
          <span class="live-dot"></span> LIVE
        </div>
        <span id="latency-display" style="font-size:10px;color:#555;"></span>
      </div>

      <!-- Fullscreen -->
      <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>

    <div class="metrics-bar">
      <div class="metric"><div class="label">Startup</div><div class="value" id="m-startup">—</div></div>
  <div class="metric"><div class="label">Bitrate (Mbps)</div><div class="value" id="m-bitrate">—</div></div>
      <div class="metric"><div class="label">Rebuffer</div><div class="value" id="m-rebuffer">0</div></div>
      <div class="metric"><div class="label">CDN</div><div class="value" id="m-cdn" style="font-size:12px">—</div></div>
  <div class="metric"><div class="label">Throughput (Mbps)</div><div class="value" id="m-throughput">—</div></div>
      <div class="metric"><div class="label">Sessioni</div><div class="value" id="m-sessions">0</div></div>
    </div>

    <div class="quality-bar">
      <label>Qualità:</label>
      <div id="quality-buttons">
        <button class="q-btn active-q" data-level="-1">AUTO</button>
      </div>
      <span style="font-size:10px;color:#333;margin-left:auto;">clicca per forzare una rendition</span>
    </div>
  </div>

  <!-- Log -->
  <div class="log-col">
    <div class="log-header">
      Event Log
      <span class="count" id="log-count">0</span>
    </div>
    <div id="event-log"></div>
    <div class="status-bar">
      <span>Collector:</span>
      <span id="collector-status" class="ok">solo log (backend non attivo)</span>
      <span style="margin-left:auto">session:</span>
      <span id="session-id-short" style="font-family:monospace">—</span>
    </div>
  </div>
</div>

<script>
// =============================================================================
// CONFIG
// =============================================================================
const CONFIG = {
  collectorUrl:      '/v1/collect',
  sdkVersion:        '1.0.0',
  heartbeatIntervalMs: 15000,
  batchSize:         5,
  flushIntervalMs:   10000,
  dryRun:            false
};

function formatMbps(kbps) {
  return kbps > 0 ? `${(kbps / 1000).toFixed(2)} Mbps` : '—';
}

function formatDvrPosition(seconds) {
  if (!Number.isFinite(seconds)) return '—';
  const total = Math.max(0, Math.round(seconds));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return hours > 0
    ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
    : `${minutes}:${String(secs).padStart(2, '0')}`;
}

function formatMediaType(mediaType) {
  return mediaType === 'muxed' ? 'video+audio' : (mediaType ?? 'video');
}

// Catalogo canali
const CHANNELS = {
  rai1: {
    id: 'rai1-live',
    title: 'RAI 1',
    relinker: '/api/relinker?ch=rai1'
  },
  rai2: {
    id: 'rai2-live',
    title: 'RAI 2',
    relinker: '/api/relinker?ch=rai2'
  },
  rainews: {
    id: 'rai-news-live',
    title: 'RAI News',
    relinker: '/api/relinker?ch=rainews'
  }
};

let currentChannelKey = 'rainews';
let hlsInstance = null;
let sessionCount = 0;

// =============================================================================
// VIEWER ID — persiste in localStorage per tutta la visita (e oltre)
//
// viewer_id  = chi è l'utente (stabile nel tempo, su questo browser)
// session_id = questa singola sessione di playback
//
// Analogia: viewer_id è come il codice fiscale, session_id è come
// il numero di uno scontrino. Ogni acquisto ha uno scontrino diverso
// ma appartiene sempre allo stesso cliente.
// =============================================================================
function getOrCreateViewerId() {
  let vid = localStorage.getItem('analytics_viewer_id');
  if (!vid) {
    vid = 'v-' + uuid();
    localStorage.setItem('analytics_viewer_id', vid);
  }
  return vid;
}

function resetViewerId() {
  localStorage.removeItem('analytics_viewer_id');
  location.reload();
}

// =============================================================================
// ANALYTICS CORE
// =============================================================================
const Analytics = (() => {
  let viewerId   = null;   // stabile — da localStorage
  let sessionId  = null;   // nuovo ad ogni playback
  let seq = 0;
  let playRequestAt = null, firstFrameAt = null;
  let bufferingStartAt = null;
  let bufferingStartCause = null;
  let pendingSeek = false;
  let totalBufferingMs = 0, bufferingCount = 0, bitrateChangeCount = 0;
  let currentBitrateKbps = 0, currentResolution = 'unknown';
  let liveJoinStart = null;
  let heartbeatTimer = null, flushTimer = null;
  let eventQueue = [];
  let totalEventsSent = 0;
  let currentChannel = null;

  function uuid_inner() { return uuid(); }
  function nowMs() { return Date.now(); }

  function updateUI() {
    document.getElementById('m-rebuffer').textContent = bufferingCount;
    document.getElementById('m-rebuffer').className = 'value ' +
      (bufferingCount === 0 ? 'good' : bufferingCount < 3 ? 'warn' : 'bad');
    document.getElementById('m-bitrate').textContent =
      formatMbps(currentBitrateKbps);
    document.getElementById('m-sessions').textContent = sessionCount;
  }

  function emit(eventType, payload) {
    if (!sessionId || !currentChannel) return;
    seq++;
    const event = {
      session_id:  sessionId,
      event_type:  eventType,
      timestamp:   nowMs(),
      platform:    'web',
      seq,
      content: {
        content_id: currentChannel.id,
        type:       'live',
        title:      currentChannel.title,
        duration_s: null
      },
      player: {
        engine:          'hls.js',
        engine_version:  Hls.version,
        sdk_version:     CONFIG.sdkVersion
      },
      network: {
        connection_type: getConnectionType(),
        cdn: document.getElementById('m-cdn').textContent || 'unknown'
      },
      device: {
        os:               getOS(),
        os_version:       'unknown',
        model:            'browser',
        screen_resolution:`${screen.width}x${screen.height}`
      },
      payload
    };
    eventQueue.push(event);
    logEvent(event);
    if (eventQueue.length >= CONFIG.batchSize) flush('threshold');
  }

  function getConnectionType() {
    if (!navigator.connection) return 'unknown';
    const t = navigator.connection.type;
    if (t === 'wifi') return 'wifi';
    if (t === 'cellular') return 'cellular';
    if (t === 'ethernet') return 'ethernet';
    return 'unknown';
  }
  function getOS() {
    const ua = navigator.userAgent;
    if (/Windows/i.test(ua)) return 'windows';
    if (/Mac OS X/i.test(ua)) return 'macos';
    if (/iPhone|iPad/i.test(ua)) return 'ios';
    if (/Android/i.test(ua)) return 'android';
    return 'unknown';
  }

  async function flush(reason) {
    if (eventQueue.length === 0) return;
    const batch = {
      sdk_version: CONFIG.sdkVersion,
      sent_at:     nowMs(),
      events:      eventQueue.splice(0)
    };
    totalEventsSent += batch.events.length;
    updateUI();
    if (CONFIG.dryRun) { console.log('[Analytics] DRY RUN', batch); return; }
    try {
      const response = await fetch(CONFIG.collectorUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(batch),
        keepalive: true
      });
      if (!response.ok) throw new Error(`Collector returned ${response.status}`);
      document.getElementById('collector-status').textContent = 'connesso ✓';
      document.getElementById('collector-status').className = 'ok';
    } catch {
      document.getElementById('collector-status').textContent = 'non raggiungibile (solo log)';
      document.getElementById('collector-status').className = 'err';
    }
  }

  return {
    init(vid) {
      viewerId = vid;
      document.getElementById('viewer-id-display').textContent = vid.slice(0, 16) + '…';
      flushTimer = setInterval(() => flush('timer'), CONFIG.flushIntervalMs);
    },

    // Chiude la sessione corrente (se esiste) prima di aprirne una nuova
    startSession(channel) {
      if (sessionId) {
        // SESSION_END della sessione precedente
        emit('SESSION_END', {
          watch_time_s:          firstFrameAt ? (nowMs() - firstFrameAt) / 1000 : 0,
          completion_pct:        null,
          reason:                'user_stop',
          rebuffer_count:        bufferingCount,
          rebuffer_time_s:       totalBufferingMs / 1000,
          bitrate_change_count:  bitrateChangeCount
        });
        flush('channel_switch');
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }

      // Reset stato per la nuova sessione
      currentChannel    = channel;
      sessionId         = uuid_inner();
      seq               = 0;
      playRequestAt     = null;
      firstFrameAt      = null;
      bufferingStartAt  = null;
      totalBufferingMs  = 0;
      bufferingCount    = 0;
      bitrateChangeCount = 0;
      liveJoinStart     = nowMs();
      sessionCount++;

      emit('SESSION_START', { autoplay: true });

      // Aggiorna UI
      document.getElementById('session-id-short').textContent = sessionId.slice(0,8) + '…';
      document.getElementById('m-startup').textContent = '—';
      document.getElementById('m-rebuffer').textContent = '0';
      document.getElementById('m-rebuffer').className = 'value good';
      document.getElementById('m-cdn').textContent = '—';
      document.getElementById('m-throughput').textContent = '—';
      updateUI();

      // Separatore visivo nel log
      addLogDivider(channel.title);
    },

    onPlayRequest() {
      playRequestAt = nowMs();
      emit('PLAY_REQUEST', {});
    },

    onFirstFrame() {
      if (firstFrameAt) return;
      const startupMs = playRequestAt ? nowMs() - playRequestAt : 0;
      firstFrameAt    = nowMs();
      bufferingStartAt = null; // annulla buffering di startup
      emit('FIRST_FRAME', { startup_time_ms: startupMs });
      const el = document.getElementById('m-startup');
      el.textContent = startupMs + ' ms';
      el.className = 'value ' + (startupMs < 3000 ? 'good' : startupMs < 8000 ? 'warn' : 'bad');
      if (liveJoinStart) {
        emit('JOIN_TIME', { join_time_ms: nowMs() - liveJoinStart });
        liveJoinStart = null;
      }
      heartbeatTimer = setInterval(() => {
        const v = document.getElementById('video');
        emit('HEARTBEAT', {
          playback_position_s:  v.currentTime,
          current_bitrate_kbps: currentBitrateKbps,
          current_resolution:   currentResolution,
          is_buffering:         bufferingStartAt !== null,
          rebuffer_time_ms:     totalBufferingMs
        });
      }, CONFIG.heartbeatIntervalMs);
    },

    onBufferingStart(posS, cause = 'network') {
      const bufferingCause = pendingSeek ? 'seek' : cause;
      if (bufferingStartAt) return;
      if (!firstFrameAt && bufferingCause !== 'seek') return; // ignora startup
      bufferingStartAt = nowMs();
      bufferingStartCause = bufferingCause;
      pendingSeek = false;
      emit('BUFFERING_START', { playback_position_s: posS, cause: bufferingCause });
    },

    onBufferingEnd(posS) {
      if (!bufferingStartAt) return;
      const dur = nowMs() - bufferingStartAt;
      const wasSeekBuffering = bufferingStartCause === 'seek';
      if (!wasSeekBuffering) {
        totalBufferingMs += dur;
        bufferingCount++;
      }
      bufferingStartAt = null;
      bufferingStartCause = null;
      emit('BUFFERING_END', { playback_position_s: posS, buffering_duration_ms: dur });
      updateUI();
    },

    onBitrateChange(prevKbps, newKbps, prevRes, newRes, posS, codec, reason = 'auto') {
      currentBitrateKbps = newKbps;
      currentResolution  = newRes;
      bitrateChangeCount++;
      emit('BITRATE_CHANGE', {
        previous_bitrate_kbps: prevKbps, new_bitrate_kbps: newKbps,
        previous_resolution: prevRes,    new_resolution: newRes,
        reason, playback_position_s: posS, codec
      });
      updateUI();
    },

    onCdnRequest(data) { emit('CDN_REQUEST', data); },

    onError(code, msg, source, fatal) {
      emit('ERROR', { error_code: code, error_message: msg, source, fatal,
        vsf_type: !firstFrameAt ? 'technical' : undefined });
    },

    onPause(posS) {
      emit('PAUSE', { playback_position_s: posS });
    },

    onResume(posS) {
      emit('RESUME', { playback_position_s: posS, pause_duration_ms: 0 });
    },

    onSeek(fromS, toS) {
      if (!Number.isFinite(fromS) || !Number.isFinite(toS) || Math.abs(toS - fromS) < 0.1) return;
      pendingSeek = true;
      emit('SEEK', { from_position_s: fromS, to_position_s: toS });
    },

    onSeekComplete() {
      pendingSeek = false;
    },

    onLiveLatency(latencyS, posS) {
      emit('LIVE_LATENCY', { latency_s: latencyS, playback_position_s: posS });
    },

    flushNow() { flush('unload'); }
  };
})();

// =============================================================================
// LOG UI
// =============================================================================
let logCount = 0;

function addLogDivider(channelName) {
  const log = document.getElementById('event-log');
  const div = document.createElement('div');
  div.className = 'event-row et-SESSION_DIVIDER';
  div.style.cssText = 'padding:6px 12px; color:#555; font-size:10px; text-transform:uppercase; letter-spacing:1px; border-top:1px solid #2a2a2a;';
  div.textContent = `▶ Nuova sessione — ${channelName}`;
  log.insertBefore(div, log.firstChild);
}

function logEvent(event) {
  logCount++;
  document.getElementById('log-count').textContent = logCount;
  const log = document.getElementById('event-log');
  const row = document.createElement('div');
  row.className = 'event-row';

  const t = new Date(event.timestamp);
  const ts = t.toTimeString().slice(0,8) + '.' + String(t.getMilliseconds()).padStart(3,'0');

  const p = event.payload;
  let detail = '';
  if (event.event_type === 'SESSION_START')
    detail = `session: ${event.session_id.slice(0,8)}…`;
  else if (event.event_type === 'SESSION_END')
    detail = `watch: ${p.watch_time_s?.toFixed(0)}s | rebuf: ${p.rebuffer_count} | motivo: ${p.reason}`;
  else if (event.event_type === 'FIRST_FRAME')
    detail = `startup: ${p.startup_time_ms}ms`;
  else if (event.event_type === 'HEARTBEAT')
    detail = `pos: ${p.playback_position_s?.toFixed(0)}s | ${formatMbps(p.current_bitrate_kbps)}`;
  else if (event.event_type === 'BITRATE_CHANGE')
    detail = `${formatMbps(p.previous_bitrate_kbps)} → ${formatMbps(p.new_bitrate_kbps)} | ${p.new_resolution} [${p.reason}]`;
  else if (event.event_type === 'BUFFERING_END')
    detail = `durata: ${p.buffering_duration_ms}ms`;
  else if (event.event_type === 'CDN_REQUEST')
    detail = `${p.cdn_name} · ${formatMediaType(p.media_type)} | ${formatMbps(p.throughput_kbps)} | ${Math.round(p.duration_ms)}ms`;
  else if (event.event_type === 'JOIN_TIME')
    detail = `${p.join_time_ms}ms`;
  else if (event.event_type === 'SEEK')
    detail = `${formatDvrPosition(p.from_position_s)} → ${formatDvrPosition(p.to_position_s)}`;
  else if (event.event_type === 'ERROR')
    detail = `${p.error_code} (${p.source})`;
  else
    detail = JSON.stringify(p).slice(0, 55);

  row.innerHTML = `
    <div class="event-time">${ts}</div>
    <div><div class="event-type et-${event.event_type}">${event.event_type}</div></div>
    <div class="event-detail">${detail}</div>`;
  log.insertBefore(row, log.firstChild);
  if (log.children.length > 300) log.removeChild(log.lastChild);
}

// =============================================================================
// UUID helper
// =============================================================================
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID)
    return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

// =============================================================================
// RELINKER PROXY
// =============================================================================
async function resolveHlsUrl(channelKey) {
  try {
    const resp = await fetch(`/api/relinker?ch=${channelKey}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    if (!json.url) throw new Error('URL mancante');
    return json.url;
  } catch(e) {
    console.error('[relinker]', e);
    return null;
  }
}

// =============================================================================
// PLAYER — avvia o cambia canale
// =============================================================================
async function startPlayer(channelKey) {
  const channel = CHANNELS[channelKey];
  const video   = document.getElementById('video');
  video.addEventListener('timeupdate', updateDvrControl);
  video.addEventListener('loadedmetadata', updateDvrControl);
  video.addEventListener('seeked', () => Analytics.onSeekComplete());

  // Aggiorna UI header
  document.getElementById('header-logo').textContent = channel.title;
  document.getElementById('channel-overlay').textContent = channel.title;

  // Risolvi URL HLS fresco (token valido)
  const hlsUrl = await resolveHlsUrl(channelKey);
  if (!hlsUrl) {
    document.getElementById('channel-overlay').textContent = '⚠ Errore stream';
    return;
  }

  // Distruggi il player precedente se esiste
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  // Apri la nuova sessione analytics (chiude automaticamente la precedente)
  Analytics.startSession(channel);
  Analytics.onPlayRequest();

  if (!Hls.isSupported()) {
    video.src = hlsUrl;
    video.addEventListener('canplay', () => Analytics.onFirstFrame(), { once: true });
    video.play().catch(() => {});
    return;
  }

  const hls = new Hls({ enableWorker: true, lowLatencyMode: false });
  hlsInstance = hls;

  hls.loadSource(hlsUrl);
  hls.attachMedia(video);

  // ── Manifest parsed: popola selettore qualità ──
  hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
    video.play().catch(() => {});
    buildQualityButtons(hls, data.levels);
  });

  // First frame
  video.addEventListener('playing', () => {
    Analytics.onFirstFrame();
    startLatencyMonitor();
  }, { once: true });

  // Buffering
  video.addEventListener('waiting', () => Analytics.onBufferingStart(video.currentTime, 'network'));
  video.addEventListener('playing', () => Analytics.onBufferingEnd(video.currentTime));

  // Bitrate change
  let prevLevel = -1;
  hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
    const levels = hls.levels;
    if (!levels?.[data.level]) return;
    const newL   = levels[data.level];
    const oldL   = prevLevel >= 0 ? levels[prevLevel] : null;
    const newKbps = Math.round(newL.bitrate / 1000);
    const newRes  = `${newL.width}x${newL.height}`;
    const prevKbps = oldL ? Math.round(oldL.bitrate / 1000) : 0;
    const prevRes  = oldL ? `${oldL.width}x${oldL.height}` : 'unknown';
    const reason   = hls.autoLevelEnabled ? 'auto' : 'user';
    Analytics.onBitrateChange(prevKbps, newKbps, prevRes, newRes,
                              video.currentTime, newL.attrs?.CODECS, reason);
    updateQualityHighlight(hls, data.level);
    prevLevel = data.level;
  });

  // CDN per-segment
  hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
    const stats = data.frag?.stats;
    if (!stats) return;
    const bytes  = stats.total ?? 0;
    const durMs  = stats.loading.end - stats.loading.start;
    const ttfbMs = stats.loading.first - stats.loading.start;
    const kbps   = durMs > 0 ? Math.round((bytes * 8) / durMs) : 0;
    let cdn = 'unknown';
    let mediaType = 'video';
    const fragmentType = data.frag?.type ?? data.type;
    if (fragmentType === 'audio') mediaType = 'audio';
    else if (fragmentType === 'subtitle') mediaType = 'subtitle';
    else if (fragmentType === 'main') {
      const level = hls.levels?.[data.frag?.level] ?? hls.levels?.[hls.currentLevel];
      const codecs = [
        level?.audioCodec,
        level?.attrs?.CODECS,
        level?.codecSet
      ].filter(Boolean).join(',');
      const hasAudioCodec = /mp4a|ac-3|ec-3|opus|vorbis/i.test(codecs);
      const hasSeparateAudio = hls.audioTracks?.some(track => track.url);
      if (hasAudioCodec && !hasSeparateAudio) mediaType = 'muxed';
    }
    try {
      const h = new URL(data.frag.url).hostname.toLowerCase();
      cdn = h.includes('msvdn') ? 'mainstreaming'
          : h.includes('akamaized') || h.includes('akamai') ? 'akamai'
          : h.includes('netrw') ? 'raiway'
          : h.includes('cloudfront') ? 'cloudfront'
          : h.includes('fastly') ? 'fastly'
          : h;
    } catch {}
    document.getElementById('m-cdn').textContent = cdn;
    document.getElementById('m-throughput').textContent = formatMbps(kbps);
    Analytics.onCdnRequest({
      cdn_name: cdn, request_type: 'segment', media_type: mediaType,
      http_status: 200, ttfb_ms: ttfbMs, duration_ms: durMs,
      bytes, throughput_kbps: kbps, sequence_number: data.frag?.sn
    });
  });

  // Errori fatali
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) return;
    Analytics.onError(
      data.details ?? 'HLS_ERROR', data.reason ?? 'hls.js fatal error',
      data.type === Hls.ErrorTypes.NETWORK_ERROR ? 'network' : 'player', true
    );
  });
}

// =============================================================================
// QUALITÀ
// =============================================================================
function buildQualityButtons(hls, levels) {
  const container = document.getElementById('quality-buttons');
  container.innerHTML = '<button class="q-btn active-q" data-level="-1">AUTO</button>';
  levels.forEach((l, i) => {
    const res = l.height ? `${l.height}p` : `${Math.round(l.bitrate/1000)}k`;
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.dataset.level = i;
    btn.textContent = res;
    btn.title = `${formatMbps(l.bitrate / 1000)} — ${l.width}x${l.height}`;
    container.appendChild(btn);
  });
  container.onclick = e => {
    const btn = e.target.closest('.q-btn');
    if (!btn || !hlsInstance) return;
    const level = parseInt(btn.dataset.level);
    container.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active-q'));
    btn.classList.add('active-q');
    if (level === -1) {
      hlsInstance.currentLevel = -1;
      hlsInstance.loadLevel = -1;
    } else {
      hlsInstance.currentLevel = level;
      hlsInstance.loadLevel = level;
    }
  };
}

function updateQualityHighlight(hls, activeLevel) {
  if (!hls.autoLevelEnabled) return;
  document.querySelectorAll('#quality-buttons .q-btn').forEach(b => {
    const l = parseInt(b.dataset.level);
    b.style.textDecoration = (l === activeLevel) ? 'underline' : 'none';
  });
}

// =============================================================================
// CAMBIO CANALE
// =============================================================================
function switchChannel(channelKey, btn) {
  if (channelKey === currentChannelKey) return;
  currentChannelKey = channelKey;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startPlayer(channelKey);
}

// =============================================================================
// CONTROLLI PLAYER CUSTOM
// =============================================================================
function togglePlayPause() {
  const v = document.getElementById('video');
  const btn = document.getElementById('btn-playpause');
  if (v.paused) {
    v.play();
    btn.textContent = '⏸';
    Analytics.onResume(v.currentTime);
  } else {
    v.pause();
    btn.textContent = '▶';
    Analytics.onPause(v.currentTime);
  }
}

function toggleMute() {
  const v = document.getElementById('video');
  const btn = document.getElementById('btn-mute');
  v.muted = !v.muted;
  btn.textContent = v.muted ? '🔇' : '🔊';
  if (!v.muted) v.volume = parseFloat(document.getElementById('volume-slider').value) || 1;
}

function setVolume(val) {
  const v = document.getElementById('video');
  v.volume = parseFloat(val);
  v.muted = (parseFloat(val) === 0);
  document.getElementById('btn-mute').textContent = v.muted ? '🔇' : '🔊';
}

function toggleFullscreen() {
  const wrapper = document.querySelector('.video-wrapper');
  if (!document.fullscreenElement) {
    wrapper.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// Riporta al live edge (utile se hls.js è scivolato indietro nel buffer)
function seekToLive() {
  if (!hlsInstance) return;
  const v = document.getElementById('video');
  // hls.js: liveSyncPosition è il punto "live edge" corretto
  const liveEdge = hlsInstance.liveSyncPosition;
  if (Number.isFinite(liveEdge)) {
    const fromPosition = v.currentTime;
    v.currentTime = liveEdge;
    Analytics.onSeek(fromPosition, liveEdge);
    updateDvrControl();
  }
}

function getDvrWindow() {
  const video = document.getElementById('video');
  if (!video.seekable || video.seekable.length === 0) return null;

  const start = video.seekable.start(0);
  const end = video.seekable.end(video.seekable.length - 1);
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
  return { start, end };
}

function updateDvrControl() {
  const control = document.getElementById('dvr-control');
  const slider = document.getElementById('dvr-seek');
  if (!control || !slider) return;

  const window = getDvrWindow();
  if (!window || window.end - window.start < 1) {
    control.hidden = true;
    slider.disabled = true;
    return;
  }

  control.hidden = false;
  slider.disabled = false;
  slider.min = window.start;
  slider.max = window.end;

  const video = document.getElementById('video');
  const current = Math.min(window.end, Math.max(window.start, video.currentTime));
  if (document.activeElement !== slider && Number.isFinite(current)) {
    slider.value = current;
  }
  const behindLive = window.end - current;
  document.getElementById('dvr-time').textContent =
    behindLive <= 1 ? 'LIVE' : `-${formatDvrPosition(behindLive)}`;
}

function previewDvrPosition(value) {
  const window = getDvrWindow();
  const target = Number(value);
  if (!window || !Number.isFinite(target)) return;
  const behindLive = window.end - Math.min(window.end, Math.max(window.start, target));
  document.getElementById('dvr-time').textContent =
    behindLive <= 1 ? 'LIVE' : `-${formatDvrPosition(behindLive)}`;
}

function seekToDvr(value) {
  const video = document.getElementById('video');
  const window = getDvrWindow();
  const target = Number(value);
  if (!window || !Number.isFinite(target)) return;

  const fromPosition = video.currentTime;
  const toPosition = Math.min(window.end, Math.max(window.start, target));
  if (!Number.isFinite(fromPosition) || Math.abs(toPosition - fromPosition) < 0.1) {
    updateDvrControl();
    return;
  }

  video.currentTime = toPosition;
  Analytics.onSeek(fromPosition, toPosition);
  updateDvrControl();
}

// Monitora la latenza live (differenza tra live edge e posizione corrente)
function startLatencyMonitor() {
  setInterval(() => {
    updateDvrControl();
    if (!hlsInstance) return;
    const v = document.getElementById('video');
    const edge = hlsInstance.liveSyncPosition;
    if (!edge || !isFinite(edge)) return;
    const latency = edge - v.currentTime;
    const display = document.getElementById('latency-display');
    const indicator = document.getElementById('live-indicator');
    if (latency >= 0 && latency < 60) {
      display.textContent = `latenza: ${latency.toFixed(1)}s`;
      // "at live" = meno di 3s di ritardo
      indicator.classList.toggle('at-live', latency < 3);
      // Emetti evento LIVE_LATENCY ogni 30s
      if (Math.round(Date.now() / 1000) % 30 === 0) {
        Analytics.onLiveLatency(latency, v.currentTime);
      }
    }
  }, 2000);
}

// ANALYTICS — aggiungo metodi mancanti

window.addEventListener('pagehide',        () => Analytics.flushNow());
window.addEventListener('visibilitychange',() => {
  if (document.visibilityState === 'hidden') Analytics.flushNow();
});

Analytics.init(viewerId);
startPlayer('rainews');
